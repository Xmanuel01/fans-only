<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Not Found</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <script>
      (function () {
        var redirect = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem('redirect-path', redirect);
        } catch (e) {
          // Ignore storage failures and fall back to root.
        }
        window.location.replace('/');
      })();
    </script>
  </body>
</html>
