name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-app:
    name: Landing app (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landingpage
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landingpage/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  user-app:
    name: User app (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint (type check)
        run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}
          VITE_HELP_CENTER_URL: ${{ secrets.VITE_HELP_CENTER_URL != '' && secrets.VITE_HELP_CENTER_URL || 'https://example.com/help' }}
          VITE_EXIT_URL: ${{ secrets.VITE_EXIT_URL != '' && secrets.VITE_EXIT_URL || 'https://example.com/exit' }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL != '' && secrets.VITE_SUPPORT_EMAIL || 'support@example.com' }}
        run: npm run build

  creator-app:
    name: Creator app (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creator-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint (type check)
        run: npm run lint
      - name: Build
        run: npm run build

  unified-static-build:
    name: Unified static build (root dist)
    runs-on: ubuntu-latest
    needs: [landing-app, user-app, creator-app]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landingpage/package-lock.json
            user-side/package-lock.json
            creator-side/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Runtime mock guard
        run: npm run check:no-mock-runtime
      - name: Build unified dist
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}
          VITE_HELP_CENTER_URL: ${{ secrets.VITE_HELP_CENTER_URL != '' && secrets.VITE_HELP_CENTER_URL || 'https://example.com/help' }}
          VITE_EXIT_URL: ${{ secrets.VITE_EXIT_URL != '' && secrets.VITE_EXIT_URL || 'https://example.com/exit' }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL != '' && secrets.VITE_SUPPORT_EMAIL || 'support@example.com' }}
        run: npm run build
      - name: Verify dist layout
        run: |
          test -f dist/app/index.html
          test -f dist/user/index.html
          test -f dist/creator/index.html

  smoke-http:
    name: HTTP smoke checks (preview/prod)
    runs-on: ubuntu-latest
    needs: [unified-static-build]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke production URL
        if: ${{ secrets.SMOKE_PROD_BASE_URL != '' }}
        run: node scripts/smoke-check.mjs "${{ secrets.SMOKE_PROD_BASE_URL }}"
      - name: Smoke preview URL
        if: ${{ secrets.SMOKE_PREVIEW_BASE_URL != '' }}
        run: node scripts/smoke-check.mjs "${{ secrets.SMOKE_PREVIEW_BASE_URL }}"
      - name: Skip notice
        if: ${{ secrets.SMOKE_PROD_BASE_URL == '' && secrets.SMOKE_PREVIEW_BASE_URL == '' }}
        run: echo "No smoke base URL secrets configured; skipping HTTP smoke checks."

  supabase-migrations:
    name: Supabase migrations dry-run
    runs-on: ubuntu-latest
    needs: [landing-app, user-app, creator-app, unified-static-build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show Supabase version
        run: supabase --version
      - name: Lint and dry-run migrations (skips if no DB URL secret)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "No SUPABASE_DB_URL secret set; skipping dry-run."
            exit 0
          fi
          supabase db lint
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
