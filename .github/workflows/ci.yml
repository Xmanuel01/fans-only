name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-app:
    name: User app (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (type check)
        run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}
        run: npm run build

  creator-app:
    name: Creator app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creator-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
