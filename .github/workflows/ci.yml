name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-app:
    name: User app (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint (type check)
        run: npm run lint
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' && secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' && secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}
        run: npm run build

  creator-app:
    name: Creator app (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creator-side
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creator-side/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  supabase-migrations:
    name: Supabase migrations dry-run
    runs-on: ubuntu-latest
    needs: [user-app, creator-app]
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show Supabase version
        run: supabase --version
      - name: Lint and dry-run migrations (skips if no DB URL secret)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "No SUPABASE_DB_URL secret set; skipping dry-run."
            exit 0
          fi
          supabase db lint
          supabase db push --dry-run --db-url "$SUPABASE_DB_URL"
